<svg id="architecture-diagram" viewBox="0 0 1120 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc"><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.label{font-size:10px;letter-spacing:1.1px;font-weight:700;fill:#647971}.title{font-size:18px;font-weight:650;fill:#17332f}.body{font-size:12px;fill:#647971}.tag{font-size:10px;font-weight:650;fill:#16684e}.linklabel{font-size:10px;fill:#526b5e}</style>
<title id="diagram-title">SiteAssistant: architettura prevista su Railway</title><desc id="diagram-desc">GitHub fornisce il codice per il deploy. Il browser raggiunge applicazione e API, che usano PostgreSQL su rete privata. Export del sistema sorgente e file da un archivio S3 compatibile vengono acquisiti tramite collegamenti da implementare. Gli aggiornamenti interni restano distinti dagli stati ufficiali.</desc>
