<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF6EC">
  <meta name="description" content="SiteAssistant — sites, tasks and daily log.">
  <meta name="siteassistant-api-base" content="/">
  <title>SiteAssistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <script type="module" src="app.mjs" blocking="render"></script>
</head>
<body>
  <a class="skip" href="#main" id="skip">Skip to content</a>
  <aside class="sidebar">
    <a href="#overview" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="2.2"/>
        <path d="M6.2 7.4h8.2M6.2 11.4h11.6M6.2 15.4h6.4"/>
      </svg>
      SiteAssistant
    </a>
    <div class="rail-navigation"></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <a href="#overview" class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="2.2"/>
            <path d="M6.2 7.4h8.2M6.2 11.4h11.6M6.2 15.4h6.4"/>
          </svg>
          SiteAssistant
        </a>
      </div>
      <div class="topbar-actions">
        <button id="ai-top" class="ai-top text-button" type="button" data-command="ai-open" aria-label="Assistente AI" aria-expanded="false" aria-controls="ai-panel" hidden>AI</button>
        <button id="settings-button" class="text-button" type="button" data-command="open-settings" aria-label="Settings" title="Settings">⚙</button>
        <a id="manual-link" class="manual-link" href="https://as76.github.io/SiteAssistant/en/guida/accesso/" target="_blank" rel="noopener noreferrer">Manual</a>
        <button id="language" class="language" type="button" aria-label="Passa all’italiano" lang="it">IT</button>
      </div>
      <div class="site-control" hidden>
        <label id="site-label" for="site-select">Site</label>
        <span class="topbar-code" id="topbar-code" hidden></span>
        <div class="site-choice">
          <select id="site-select"></select>
          <span id="site-location" hidden></span>
        </div>
      </div>
      <div class="operational-context" id="operational-context" hidden>
        <span class="operational-label" id="operational-label">Operational day</span>
        <time id="operational-date"></time>
        <span id="operational-shift"></span>
        <span class="actor-control"><span id="actor-name"></span><strong id="actor-role"></strong></span>
      </div>
      <div class="topbar-navigation">
        <nav id="navigation" aria-label="Main" hidden></nav>
      </div>
    </header>
    <section class="demo-banner" id="demo-banner" aria-labelledby="demo-notice-title" hidden>
      <p><strong id="demo-notice-title"></strong> <span id="demo-notice-text"></span>
        <a id="demo-feedback" href="https://github.com/AS76/SiteAssistant/issues" target="_blank" rel="noopener noreferrer"></a>
      </p>
      <button id="dismiss-demo-notice" type="button" class="text-button" data-command="dismiss-demo-notice">×</button>
    </section>
    <section id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden></section>
    <main id="main" tabindex="-1"></main>
    <button id="ai-fab" class="ai-fab" type="button" data-command="ai-open" aria-label="Assistente AI" aria-expanded="false" aria-controls="ai-panel" hidden>AI</button>
  <aside id="ai-panel" class="ai-panel" aria-label="Assistente AI" hidden>
    <header class="ai-head"><strong id="ai-title">Assistente</strong><button type="button" class="text-button" data-command="ai-close" aria-label="Chiudi">×</button></header>
    <div id="ai-log" class="ai-log" role="log" aria-live="polite"></div>
    <div id="ai-suggestions" class="ai-suggestions"></div>
    <p id="ai-error" class="note" role="alert" hidden></p>
    <form id="ai-form" class="ai-form" autocomplete="off">
      <input name="message" type="text" maxlength="500" placeholder="Chiedi sui dati del cantiere" required>
      <button type="submit" class="primary">Invia</button>
    </form>
  </aside>
  <footer>
    <span id="footer-note"></span>
    <a id="privacy-link" class="text-button" href="/privacy"></a>
    <a id="cookie-link" class="text-button" href="/cookie-policy"></a>
    <button id="demo-info" type="button" class="text-button" data-command="open-demo-info" aria-haspopup="dialog" hidden></button>
  </footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
</body>
</html>
