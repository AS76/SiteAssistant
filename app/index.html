<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="SiteAssistant — cantieri, attività e diario giornaliero.">
  <title>SiteAssistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main" id="skip">Vai al contenuto</a>
  <aside class="sidebar">
    <a href="#overview" class="brand"><span class="brand-mark" aria-hidden="true">S<span>▰</span></span><span>SiteAssistant<small id="brand-sub">IL TUO PUNTO DI CONTROLLO</small></span></a>
    <div class="nav-label" id="workspace-label">SPAZIO DI LAVORO</div>
    <nav id="navigation" aria-label="Principale"></nav>
    <div class="sidebar-bottom"><span class="online-dot"></span><div id="local-label">Spazio locale<small>Demo · dati fittizi</small></div></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <label class="site-control"><span id="site-label">Cantiere</span><select id="site-select"></select></label>
      <div class="topbar-actions"><label class="actor-control"><span id="actor-label">Persona demo</span><select id="actor-select"></select></label><button id="language" class="language" type="button" aria-label="Switch to English">EN</button></div>
    </header>
    <div class="demo-banner" id="demo-banner"></div>
    <div id="storage-banner" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
    <footer><span id="footer-note"></span><div><button type="button" class="text-button" id="backup"></button><button type="button" class="text-button" id="restore"></button><button type="button" class="text-button" id="reset"></button></div></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input type="file" id="restore-file" accept=".json,application/json" hidden>
</body>
</html>
