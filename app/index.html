<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF6EC">
  <meta name="description" content="SiteAssistant — cantieri, attività e diario giornaliero.">
  <meta name="siteassistant-api-base" content="/">
  <title>SiteAssistant</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main" id="skip">Vai al contenuto</a>
  <aside class="sidebar">
    <a href="#overview" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="2.2"/>
        <path d="M6.2 7.4h8.2M6.2 11.4h11.6M6.2 15.4h6.4"/>
      </svg>
      SiteAssistant
    </a>
    <div class="rail-navigation"></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-brand">
        <a href="#overview" class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="2.2"/>
            <path d="M6.2 7.4h8.2M6.2 11.4h11.6M6.2 15.4h6.4"/>
          </svg>
          SiteAssistant
        </a>
      </div>
      <div class="topbar-actions">
        <button id="ai-top" class="ai-top text-button" type="button" data-command="ai-open" aria-label="Assistente AI" aria-expanded="false" aria-controls="ai-panel">AI</button>
        <button id="settings-button" class="text-button" type="button" data-command="open-settings" aria-label="Impostazioni" title="Impostazioni">⚙</button>
        <a id="manual-link" class="manual-link" href="https://as76.github.io/SiteAssistant/" target="_blank" rel="noopener noreferrer">Manuale</a>
        <button id="language" class="language" type="button" aria-label="Switch to English">EN</button>
      </div>
      <div class="site-control">
        <label id="site-label" for="site-select">Cantiere</label>
        <span class="topbar-code" id="topbar-code" hidden></span>
        <div class="site-choice">
          <select id="site-select"></select>
          <span id="site-location" hidden></span>
        </div>
      </div>
      <div class="operational-context" id="operational-context" hidden>
        <span class="operational-label" id="operational-label">Giorno operativo</span>
        <time id="operational-date"></time>
        <span id="operational-shift"></span>
        <span class="actor-control"><span id="actor-name"></span><strong id="actor-role"></strong></span>
      </div>
      <div class="topbar-navigation">
        <nav id="navigation" aria-label="Principale" hidden></nav>
      </div>
    </header>
    <div class="demo-banner" id="demo-banner"></div>
    <section id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden></section>
    <main id="main" tabindex="-1"></main>
    <button id="ai-fab" class="ai-fab" type="button" data-command="ai-open" aria-label="Assistente AI" aria-expanded="false" aria-controls="ai-panel">AI</button>
  <aside id="ai-panel" class="ai-panel" aria-label="Assistente AI" hidden>
    <header class="ai-head"><strong id="ai-title">Assistente</strong><button type="button" class="text-button" data-command="ai-close" aria-label="Chiudi">×</button></header>
    <div id="ai-log" class="ai-log" role="log" aria-live="polite"></div>
    <div id="ai-suggestions" class="ai-suggestions"></div>
    <form id="ai-form" class="ai-form" autocomplete="off">
      <input name="message" type="text" maxlength="500" placeholder="Chiedi sui dati del cantiere" required>
      <button type="submit" class="primary">Invia</button>
    </form>
  </aside>
  <footer><span id="footer-note"></span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
</body>
</html>
