name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (SQLite e PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci || npm install --no-audit --no-fund
      - run: env -u DATABASE_URL npm test
      - run: npm run test:schema

  postgres:
    name: Test (PostgreSQL reale)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: siteassistant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DRIVER: pg
      SA_TEST_DB: siteassistant_test
      DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/siteassistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci || npm install --no-audit --no-fund
      - run: env -u DATABASE_URL npm run test:pg
