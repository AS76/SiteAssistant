name: Token guard

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nessuna occorrenza del token vietato nel contenuto
        run: |
          TOKEN=$(printf 'bG1z' | base64 -d)
          if git grep -qiI -- "$TOKEN" -- . ':!docs-site/package-lock.json'; then
            echo "::error::Il contenuto del repository contiene il token vietato."
            git grep -niI -- "$TOKEN" -- . ':!docs-site/package-lock.json' | head -20
            exit 1
          fi
          echo "Contenuto pulito."

      - name: Nessuna occorrenza nei messaggi dell'ultimo push
        run: |
          TOKEN=$(printf 'bG1z' | base64 -d)
          range="${{ github.event.before }}..${{ github.sha }}"
          if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          fi
          if git log --format='%B' "$range" 2>/dev/null | grep -qi -- "$TOKEN"; then
            echo "::error::Un messaggio di commit dell'ultimo push contiene il token vietato."
            exit 1
          fi
          echo "Messaggi puliti."
