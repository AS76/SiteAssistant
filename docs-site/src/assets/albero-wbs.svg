<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Albero WBS della struttura progetto">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .code { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .desc { font-size: 12px; fill: #6b7280; }
    .badge { font-size: 10px; font-weight: 700; fill: #b45309; }
  </style>
  <rect x="0" y="0" width="900" height="320" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Root -->
  <rect x="360" y="24" width="180" height="56" rx="10" fill="#126c57" stroke="#0b3b30"/>
  <text class="code" x="450" y="48" text-anchor="middle" fill="#ffffff">1</text>
  <text class="desc" x="450" y="66" text-anchor="middle" fill="#d1e7c0">Impianto · Plant</text>

  <!-- connectors root -> children -->
  <line x1="450" y1="80" x2="450" y2="108" stroke="#9ca3af" stroke-width="2"/>
  <line x1="130" y1="108" x2="770" y2="108" stroke="#9ca3af" stroke-width="2"/>
  <line x1="130" y1="108" x2="130" y2="132" stroke="#9ca3af" stroke-width="2"/>
  <line x1="450" y1="108" x2="450" y2="132" stroke="#9ca3af" stroke-width="2"/>
  <line x1="770" y1="108" x2="770" y2="132" stroke="#9ca3af" stroke-width="2"/>

  <!-- Child 1.1 -->
  <rect x="40" y="132" width="180" height="56" rx="10" fill="#ffffff" stroke="#126c57"/>
  <text class="code" x="130" y="156" text-anchor="middle">1.1</text>
  <text class="desc" x="130" y="174" text-anchor="middle">Strutture · Structures</text>

  <!-- Child 1.2 -->
  <rect x="360" y="132" width="180" height="56" rx="10" fill="#ffffff" stroke="#126c57"/>
  <text class="code" x="450" y="156" text-anchor="middle">1.2</text>
  <text class="desc" x="450" y="174" text-anchor="middle">Montaggio · Erection</text>

  <!-- Child 1.3 (synthetic, dashed) -->
  <rect x="680" y="132" width="180" height="56" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="6 4"/>
  <text class="code" x="770" y="156" text-anchor="middle">1.3</text>
  <text class="desc" x="770" y="174" text-anchor="middle">· · ·</text>
  <rect x="692" y="196" width="156" height="18" rx="9" fill="#fef9c3" stroke="#eab308"/>
  <text class="badge" x="770" y="209" text-anchor="middle">padre sintetico · synthetic parent</text>

  <!-- connectors 1.1 -> grandchildren -->
  <line x1="130" y1="188" x2="130" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="40" y1="216" x2="220" y2="216" stroke="#9ca3af" stroke-width="2"/>
  <line x1="40" y1="216" x2="40" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <line x1="220" y1="216" x2="220" y2="240" stroke="#9ca3af" stroke-width="2"/>

  <!-- Grandchild 1.1.1 -->
  <rect x="0" y="240" width="80" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="code" x="40" y="262" text-anchor="middle">1.1.1</text>
  <text class="desc" x="40" y="280" text-anchor="middle">Fondazioni</text>
  <!-- Grandchild 1.1.2 -->
  <rect x="180" y="240" width="80" height="52" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="code" x="220" y="262" text-anchor="middle">1.1.2</text>
  <text class="desc" x="220" y="280" text-anchor="middle">Tamponature</text>

  <text x="450" y="308" text-anchor="middle" font-size="12" fill="#9ca3af">Albero espandibile e tabella piatta · sola lettura · Expandable tree and flat table · read only</text>
</svg>
