<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Vista bacheca e vista elenco">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .code { font-size: 12px; font-weight: 700; fill: #4b5563; }
    .hdr { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .cell { font-size: 11px; fill: #6b7280; }
  </style>
  <rect x="0" y="0" width="900" height="340" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Board -->
  <text class="hdr" x="24" y="30">Bacheca · Board</text>
  <g>
    <!-- column todo -->
    <rect x="24" y="44" width="128" height="270" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text class="code" x="40" y="66">todo</text>
    <rect x="36" y="78" width="104" height="58" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="36" y="146" width="104" height="58" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="36" y="214" width="104" height="58" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <!-- column in_progress -->
    <rect x="160" y="44" width="128" height="270" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text class="code" x="176" y="66">in_progress</text>
    <rect x="172" y="78" width="104" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <rect x="172" y="146" width="104" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <!-- column to_verify -->
    <rect x="296" y="44" width="128" height="270" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text class="code" x="312" y="66">to_verify</text>
    <rect x="308" y="78" width="104" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  </g>

  <!-- List -->
  <text class="hdr" x="464" y="30">Elenco · List</text>
  <rect x="464" y="44" width="412" height="270" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <g>
    <rect x="464" y="44" width="412" height="40" rx="10" fill="#f3f4f6"/>
    <text class="cell" x="482" y="68">Titolo</text>
    <text class="cell" x="612" y="68">Stato</text>
    <text class="cell" x="706" y="68">Scadenza</text>
  </g>
  <g font-size="11" fill="#1f2937">
    <text x="482" y="118">Posa passerelle cavi</text>
    <circle cx="622" cy="114" r="5" fill="#3b82f6"/>
    <text x="636" y="118" fill="#6b7280">in_progress</text>
    <text x="706" y="118" fill="#6b7280">12 nov</text>

    <text x="482" y="162">Collaudo nastri Linea 3</text>
    <circle cx="622" cy="158" r="5" fill="#f59e0b"/>
    <text x="636" y="162" fill="#6b7280">to_verify</text>
    <text x="706" y="162" fill="#6b7280">14 nov</text>

    <text x="482" y="206">Verifica quadri elettrici</text>
    <circle cx="622" cy="202" r="5" fill="#16a34a"/>
    <text x="636" y="206" fill="#6b7280">closed</text>
    <text x="706" y="206" fill="#6b7280">09 nov</text>

    <text x="482" y="250">Smontaggio ponteggi</text>
    <circle cx="622" cy="246" r="5" fill="#9ca3af"/>
    <text x="636" y="250" fill="#6b7280">todo</text>
    <text x="706" y="250" fill="#6b7280">18 nov</text>
  </g>
  <line x1="464" y1="128" x2="876" y2="128" stroke="#f3f4f6"/>
  <line x1="464" y1="172" x2="876" y2="172" stroke="#f3f4f6"/>
  <line x1="464" y1="216" x2="876" y2="216" stroke="#f3f4f6"/>
  <line x1="464" y1="260" x2="876" y2="260" stroke="#f3f4f6"/>
</svg>
